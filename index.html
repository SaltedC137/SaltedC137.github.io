<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ASCII Earth</title>
  <style>
    html,
    body {
      background: #03050a;
      color: #e2e8f0;
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: monospace;
    }

    #globe-host {
      width: 100%;
      height: 100%;
      position: relative;
      touch-action: none;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 232, 184, 0.5);
      z-index: 10;
    }
  </style>
</head>

<body>
  <div id="globe-host">
    <div id="loading">Loading local topography data...</div>
  </div>

  <script type="module">
    import { createGlyphScene, createGlyphOrthographicCamera } from "https://esm.sh/glyphcss";

    const host = document.getElementById("globe-host");
    const loading = document.getElementById("loading");

    // Base path pointing to downloaded assets relative to index.html
    const DATA_BASE_PATH = "./public/data";

    // 1. Initialize orthographic camera and ASCII rendering scene
    const camera = createGlyphOrthographicCamera({
      rotX: 55,
      rotY: 45,
      zoom: 300,
    });

    const scene = createGlyphScene(host, {
      camera,
      autoSize: true,
      mode: "solid",
      useColors: true,
      glyphPalette: "default",
      directionalLight: { direction: [0.5, 0.7, 0.5], intensity: 1.1 },
      ambientLight: { intensity: 0.45 },
    });

    // 2. Geographic spherical conversion: Lat/Lon degrees to 3D Cartesian coordinates
    function latLonToXYZ(latDeg, lonDeg) {
      const lat = (latDeg * Math.PI) / 180;
      const lon = (lonDeg * Math.PI) / 180;
      const cosLat = Math.cos(lat);
      return [cosLat * Math.cos(lon), -cosLat * Math.sin(lon), Math.sin(lat)];
    }

    // 3. Setup country label overlay
    const LABEL_R = 1.06; // Elevation radius above terrain surface
    const labelElements = [];
    let labelData = [];

    function getProjectionGrid() {
      const opts = scene.getOptions();
      const cols = opts.cols ?? 80;
      const rows = opts.rows ?? 24;
      const cellAspect = opts.cellAspect ?? 2;
      const hostRect = host.getBoundingClientRect();
      const preRect = scene.output ? scene.output.getBoundingClientRect() : { width: 0, height: 0 };

      const cellWidth = preRect.width > 0 ? preRect.width / cols : hostRect.width / cols;
      const cellHeight = preRect.height > 0 ? preRect.height / rows : hostRect.height / rows;

      return { cols, rows, cellAspect, cellWidth, cellHeight };
    }

    function updateGlobeLabels() {
      if (labelData.length === 0) return;
      const pg = getProjectionGrid();
      const hostRect = host.getBoundingClientRect();
      const maxShown = Math.max(6, Math.min(labelData.length, Math.round((camera.zoom / 300) * 8)));
      const placed = [];
      let count = 0;

      for (let i = 0; i < labelElements.length; i++) {
        const rec = labelData[i];
        const [x, y, z] = latLonToXYZ(rec.lat, rec.lon);
        // Project 3D coordinate to screen row/col
        const [col, row, depth] = camera.project([x * LABEL_R, y * LABEL_R, z * LABEL_R], pg.cols, pg.rows, pg.cellAspect, pg);

        let visible = false;
        // depth < 0 indicates the point is on the front-facing hemisphere
        if (count < maxShown && depth < 0 && Number.isFinite(col)) {
          const px = col * pg.cellWidth;
          const py = row * pg.cellHeight;

          if (px >= 0 && px <= hostRect.width && py >= 0 && py <= hostRect.height) {
            const w = rec.name.length * 6 + 6;
            const h = 13;
            const box = { x: px - w / 2, y: py - h / 2, w, h };

            // Collision check: prevent overlapping labels
            const overlaps = placed.some(
              (p) => !(box.x + box.w < p.x || box.x > p.x + p.w || box.y + box.h < p.y || box.y > p.y + p.h)
            );

            if (!overlaps) {
              placed.push(box);
              count++;
              visible = true;
              labelElements[i].style.left = `${px}px`;
              labelElements[i].style.top = `${py}px`;
            }
          }
        }
        labelElements[i].style.opacity = visible ? "0.92" : "0";
      }
    }

    async function initLabels() {
      try {
        const res = await fetch(`${DATA_BASE_PATH}/flatmap/labels.json`);
        labelData = await res.json();

        for (const rec of labelData) {
          const el = document.createElement("div");
          el.textContent = rec.name;
          el.style.cssText =
            "position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:10px;" +
            "letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,245,224,0.96);" +
            "text-shadow:0 0 3px #000,0 0 6px #000;opacity:0;transition:opacity 140ms ease;" +
            "pointer-events:none;z-index:5;";
          host.appendChild(el);
          labelElements.push(el);
        }
        updateGlobeLabels();
      } catch (err) {
        console.warn("Could not load country labels:", err);
      }
    }

    // 4. Load topography tiles from local public directory
    async function init() {
      try {
        const manifestRes = await fetch(`${DATA_BASE_PATH}/tiles/manifest.json`);
        const manifest = await manifestRes.json();

        // Cache active mesh handles: Map<key, handle>
        const activeHandles = new Map();

        const tileCache = new Map(); // Cache for fetched tile data
        let isLoadingLOD = false;


        async function loadLOD(zLevel) {
          if (isLoadingLOD) return;
          isLoadingLOD = true;

          const zoomDef = manifest.zooms.find((item) => item.z === zLevel) || manifest.zooms[0];
          const newHandles = new Map();
          const fetchPromises = [];

          for (let y = 0; y < zoomDef.rows; y++) {
            for (let x = 0; x < zoomDef.cols; x++) {
              const key = `${zoomDef.z}/${x}_${y}`;

              if (tileCache.has(key)) {
                // Read directly from RAM cache
                newHandles.set(key, scene.add(tileCache.get(key)));
              } else {
                fetchPromises.push(
                  fetch(`${DATA_BASE_PATH}/tiles/${key}.json`)
                    .then((res) => {
                      if (!res.ok) throw new Error(`Tile ${key} not found`);
                      return res.json();
                    })
                    .then((polys) => {
                      tileCache.set(key, polys);
                      newHandles.set(key, scene.add(polys));
                    })
                );
              }
            }
          }

          if (fetchPromises.length > 0) {
            await Promise.all(fetchPromises);
          }

          // Dispose old meshes
          for (const [, handle] of activeHandles) {
            if (handle && handle.dispose) handle.dispose();
          }
          activeHandles.clear();

          for (const [k, v] of newHandles) {
            activeHandles.set(k, v);
          }

          isLoadingLOD = false;
          scene.rerender();
          updateGlobeLabels();
        }

        // Initially mount Level of Detail 0
        let currentLOD = 0;
        await loadLOD(currentLOD);
        await initLabels();

        loading.remove();

        // 5. Pointer drag interactions (Orbit camera)
        let dragging = false;
        let lastX = 0, lastY = 0;

        host.addEventListener("pointerdown", (e) => {
          dragging = true;
          lastX = e.clientX;
          lastY = e.clientY;
          host.setPointerCapture(e.pointerId);
        });

        host.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          const dx = e.clientX - lastX;
          const dy = e.clientY - lastY;
          lastX = e.clientX;
          lastY = e.clientY;

          camera.rotY += dx * 0.5;
          camera.rotX += dy * 0.5;
          scene.rerender();
          updateGlobeLabels();
        });

        const stopDrag = (e) => {
          dragging = false;
          try { host.releasePointerCapture(e.pointerId); } catch { }
        };
        host.addEventListener("pointerup", stopDrag);
        host.addEventListener("pointercancel", stopDrag);

        // 6. Wheel zoom and LOD switching (Switch between local LOD 0 and LOD 1)
        // 6. Smooth wheel zoom with rAF-throttled label updates
        let labelUpdateQueued = false;

        host.addEventListener("wheel", (e) => {
          e.preventDefault();
          const delta = e.deltaY * 0.001;
          camera.zoom = Math.max(80, Math.min(1200, camera.zoom * (1 - delta)));

          const targetLOD = camera.zoom >= 500 ? 1 : 0;
          if (targetLOD !== currentLOD && !isLoadingLOD) {
            currentLOD = targetLOD;
            loadLOD(currentLOD);
          } else {
            scene.rerender();
            if (!labelUpdateQueued) {
              labelUpdateQueued = true;
              requestAnimationFrame(() => {
                updateGlobeLabels();
                labelUpdateQueued = false;
              });
            }
          }
        }, { passive: false });

      } catch (err) {
        loading.textContent = "Loading failed: Check if local HTTP server is running";
        console.error(err);
      }
    }

    init();
  </script>
</body>

</html>
