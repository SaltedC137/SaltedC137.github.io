<!DOCTYPE html>
<html>
  <head>
    <script type="module" src="https://esm.sh/glyphcss/elements"></script>
    <style>
      /* Cell font-size sets the ASCII resolution; auto-size fills the box. */
      glyph-scene { display: block; width: 100%; height: 100vh; font-size: 13px; }
    </style>
  </head>
  <body>
    <glyph-perspective-camera rot-x="65" rot-y="299.8" zoom="4.55" distance="32000">
      <glyph-scene
        mode="solid"
        auto-size
        glyph-palette="default"
        use-colors="true"
        line-height="1"
        light-direction="0.64,0.76,0.12"
        light-intensity="0.95"
        light-color="#ffffff"
        ambient-intensity="0.75"
        ambient-color="#ffffff"
      >
        <glyph-orbit-controls drag wheel></glyph-orbit-controls>
        <glyph-mesh geometry="cube" size="100" auto-center></glyph-mesh>
      </glyph-scene>
    </glyph-perspective-camera>
  </body>
</html>
