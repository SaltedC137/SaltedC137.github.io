<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SaltedC137</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.7;
      color: #24292f;
      background: #fff;
      max-width: 640px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }
    h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: .3rem; }
    .role { color: #57606a; margin-bottom: 2.5rem; }
    section { margin-bottom: 2.5rem; }
    h2 {
      font-size: .85rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #57606a;
      margin-bottom: .8rem;
    }
    p { color: #24292f; }
    ul { list-style: none; padding: 0; }
    li { margin-bottom: .4rem; }
    a { color: #0969da; text-decoration: none; }
    a:hover { text-decoration: underline; }

    @media (prefers-color-scheme: dark) {
      body { color: #e6edf3; background: #0d1117; }
      .role, h2 { color: #8b949e; }
      p { color: #e6edf3; }
      a { color: #58a6ff; }
    }
  </style>
</head>
<body>
  <header>
    <h1>SaltedC137</h1>
    <p class="role">Developer &middot; based somewhere on Earth</p>
  </header>

  <main>
    <section>
      <h2>About</h2>
      <p>Hi, I'm SaltedC137. I build things with code, mostly on the web. This is my little corner of the internet.</p>
    </section>

    <section>

        <li><a href="https://github.com/SaltedC137">GitHub</a></li>

    </section>
  </main>
</body>
</html>
